name: ai-invoice-processing

services:
  postgres:
    build: ./postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Only reachable from this machine (DBeaver, psql). The other services use the internal network.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5436}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies database/migrations (once each) and database/functions (when they change), then exits
  flyway:
    image: flyway/flyway:11
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_SCHEMAS: invoicing
      FLYWAY_LOCATIONS: filesystem:/flyway/sql/migrations,filesystem:/flyway/sql/functions
      FLYWAY_CONNECT_RETRIES: 10
      # ${invoice_app_password} in R__app_role.sql
      FLYWAY_PLACEHOLDERS_INVOICE_APP_PASSWORD: ${INVOICE_APP_PASSWORD}
    volumes:
      - ./database/migrations:/flyway/sql/migrations:ro
      - ./database/functions:/flyway/sql/functions:ro
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.40.5}
    restart: unless-stopped
    environment:
      GENERIC_TIMEZONE: America/Chicago
      TZ: America/Chicago
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5681/}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # The Code node that fingerprints each file (sha256) needs Node's crypto module
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      # The only folder workflows may read or write: the original invoices
      N8N_RESTRICT_FILE_ACCESS_TO: /data/invoices
    volumes:
      - n8n_data:/home/node/.n8n
      # Versioned workflows + setup/export helpers (see scripts/)
      - ./n8n:/repo
      # Original invoices, named by their sha256; the review page reads the same volume
      - invoice_files:/data/invoices
    ports:
      - "${N8N_HOST_PORT:-5681}:5678"
    depends_on:
      flyway:
        condition: service_completed_successfully
      invoice-files-permissions:
        condition: service_completed_successfully

  # Review page (Next.js): reads the database as invoice_app and the originals read-only
  web:
    build: ./web
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      INVOICE_APP_PASSWORD: ${INVOICE_APP_PASSWORD}
      REVIEWER_USERNAME: ${REVIEWER_USERNAME}
      REVIEWER_PASSWORD_HASH: ${REVIEWER_PASSWORD_HASH}
      SESSION_SECRET: ${SESSION_SECRET}
      # Behind HTTPS in production: the session cookie is only sent over HTTPS
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Uploads go through the same pipeline as everything else
      N8N_UPLOAD_URL: http://n8n:5678/webhook/invoices
      UPLOAD_API_KEY: ${UPLOAD_API_KEY}
      FILES_DIR: /data/invoices
    volumes:
      - invoice_files:/data/invoices:ro
    ports:
      - "${WEB_HOST_PORT:-3010}:3000"
    depends_on:
      flyway:
        condition: service_completed_successfully

  # A new Docker volume belongs to root; n8n runs as node (uid 1000) and must be able to write the originals
  invoice-files-permissions:
    image: busybox:1.36
    command: chown 1000:1000 /data/invoices
    volumes:
      - invoice_files:/data/invoices

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME:-ai_invoice_processing_postgres}
  n8n_data:
    name: ${N8N_VOLUME:-ai_invoice_processing_n8n}
  invoice_files:
    name: ${INVOICE_FILES_VOLUME:-ai_invoice_processing_files}
